name: Whaless
options:
  bundleIdPrefix: com.alick
  deploymentTarget:
    # 26 起才有 .buttonStyle(.glass)：液态玻璃按钮是本项目的要求
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Whaless:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Icon Composer 文档：actool 一次生成亮/暗/着色全套，不用手工导 PNG。
      - path: Resources/Whaless.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alick.whaless.mac
        PRODUCT_NAME: Whaless
        ASSETCATALOG_COMPILER_APPICON_NAME: Whaless
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Manual
        # 用 Developer ID 证书签名：cdhash 固定，TCC 隐私授权一次后永久有效，
        # 不再因为 ad-hoc 签名每次编译 cdhash 变化而反复弹 Documents 授权。
        CODE_SIGN_IDENTITY: "Developer ID Application: Ning Huang (KLU8GF65GP)"
        CODE_SIGNING_REQUIRED: YES
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
